name: Uptime check

# Fails (GitHub then emails you about the failed scheduled run) when production is down or broken: a page that
# does not answer, the French 404 gone, the CV links not reaching a PDF. Scheduled workflows run from the default
# branch. Run it by hand from the Actions tab to test it.

on:
    schedule:
        - cron: '17 */6 * * *' # every 6 hours, off the hour so it avoids the busiest minute
    workflow_dispatch:

permissions: {}

env:
    SITE: https://nexlein.vercel.app

jobs:
    check:
        name: Production answers
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Pages, 404 and CV links
              run: |
                  fail=0
                  status() { curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$@"; }
                  expect() { # <label> <wanted> <got>
                    if [ "$2" = "$3" ]; then echo "ok    $1 ($3)"; else echo "::error::$1: wanted $2, got $3"; fail=1; fi
                  }
                  for path in / /fr/ /sitemap.xml /projects/zappy.html /fr/projects/zappy.html; do
                    expect "$path" 200 "$(status "$SITE$path")"
                  done
                  expect "unknown address is a 404" 404 "$(status "$SITE/no-such-page")"
                  expect "unknown /fr/ address is a 404" 404 "$(status "$SITE/fr/no-such-page")"
                  for path in /cv.pdf /fr/cv.pdf; do
                    pdf=$(mktemp)
                    code=$(curl --silent --location --output "$pdf" --write-out '%{http_code}' --max-time 30 "$SITE$path")
                    expect "$path reaches the file" 200 "$code"
                    expect "$path is a PDF" "%PDF-" "$(head -c 5 "$pdf")"
                  done
                  body=$(curl --silent --max-time 20 "$SITE/")
                  case "$body" in *'Nielsen'*) echo "ok    home page names the owner" ;; *) echo "::error::home page does not mention Nielsen"; fail=1 ;; esac
                  exit $fail
