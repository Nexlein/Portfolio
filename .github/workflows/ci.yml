name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Format, typecheck, test, build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: Audit
              run: npm run audit

            - name: Format
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist
                  retention-days: 7

    lighthouse:
        name: Lighthouse
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            # Audits every page in dist/: accessibility, best practices and SEO must stay >= 95,
            # performance below 80 only warns (shared CI runners make it noisy).
            - uses: treosh/lighthouse-ci-action@v12
              with:
                  configPath: ./lighthouserc.json
                  uploadArtifacts: true

    e2e:
        name: Browser tests
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            # Desktop and mobile Chromium against the production build, served with the production headers
            - name: Run Playwright
              run: npx playwright test

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7
