name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Format, typecheck, test, build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: Audit
              run: npm run audit

            - name: Format
              run: npm run format:check

            - name: Lint
              run: npm run lint

            # Unused files, exports and dependencies (knip.json); new dead code fails the build
            - name: Dead code
              run: npm run knip

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist
                  retention-days: 7

    lighthouse:
        name: Lighthouse
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            # Audits every page in dist/ (median of 3 runs): accessibility, best practices and SEO must stay >= 95,
            # performance >= 85 (it scores 94 to 99 locally; the margin is for shared CI runners).
            - uses: treosh/lighthouse-ci-action@v12
              with:
                  configPath: ./lighthouserc.json
                  uploadArtifacts: true

    e2e:
        name: Browser tests
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            - name: Install browsers
              run: npx playwright install --with-deps chromium firefox webkit

            # Desktop and mobile Chromium, plus Firefox and WebKit, against the production build, served with the production headers
            - name: Run Playwright
              run: npx playwright test

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7

    cv-pdf:
        name: CV PDF
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # publish to the `cv` release (main only)
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            # Prints /cv.html and /fr/cv.html to A4 and fails if the CV no longer fits on one page
            - name: Render the CV to PDF
              run: npm run cv:pdf

            - uses: actions/upload-artifact@v7
              with:
                  name: cv-pdf
                  path: cv-pdf
                  retention-days: 7

            # /cv.pdf and /fr/cv.pdf redirect to these files (vercel.json)
            - name: Publish to the cv release
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release view cv > /dev/null 2>&1 || gh release create cv --title "CV (latest)" --latest=false \
                    --notes "Rendered from the CV page on every push to main. Stable links: https://nexlein.vercel.app/cv.pdf (EN) and https://nexlein.vercel.app/fr/cv.pdf (FR)."
                  gh release upload cv cv-pdf/*.pdf --clobber
