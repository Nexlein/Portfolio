name: CI

on:
    push:
        branches: [main] # dev is checked by its PRs (feature → dev, dev → main)
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # a run on main may be publishing the CV

jobs:
    check:
        name: Format, typecheck, test, build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - name: Audit
              run: npm run audit

            - name: Format
              run: npm run format:check

            - name: Lint
              run: npm run lint

            # Unused files, exports and dependencies (config/knip.json); new dead code fails the build
            - name: Dead code
              run: npm run knip

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            # Typecheck already ran: only the bundle is left (npm run build would run tsc again)
            - name: Build
              run: npx vite build

            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist
                  retention-days: 7

    lighthouse:
        name: Lighthouse
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            # Audits pages from dist/ served by vite preview with the production headers, CSP included (median of 3
            # runs): accessibility, best practices and SEO must stay >= 95, performance >= 85 (it scores 94 to 99
            # locally; the margin is for shared CI runners).
            - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
              with:
                  configPath: ./config/lighthouserc.json
                  uploadArtifacts: true

    e2e:
        name: Browser tests
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            # The runners' default apt mirror can drop to a trickle: 139 MB took 8 s one day, over 30 minutes the next.
            # The grep fails the job if a new image moves that address and the sed stops working.
            - name: Use the main Ubuntu mirror
              run: |
                  sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|' /etc/apt/apt-mirrors.txt
                  ! grep -rsq 'azure\.archive\.ubuntu\.com' /etc/apt

            - name: Install browsers
              run: npx playwright install --with-deps chromium firefox webkit

            # Desktop and mobile Chromium, plus Firefox and WebKit, against the production build, served with the production headers
            - name: Run Playwright
              run: npx playwright test

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7

    cv-pdf:
        name: CV PDF
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            # Prints /cv.html and /fr/cv.html to A4 and fails if the CV no longer fits on one page
            - name: Render the CV to PDF
              run: npm run cv:pdf

            - uses: actions/upload-artifact@v7
              with:
                  name: cv-pdf
                  path: cv-pdf
                  retention-days: 7

    # Apart from cv-pdf so that the write token never sits next to npm ci or a third-party action
    publish-cv:
        name: Publish CV
        needs: cv-pdf
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write # the `cv` release
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: cv-pdf
                  path: cv-pdf

            # /cv.pdf and /fr/cv.pdf redirect to these files (vercel.json)
            - name: Publish to the cv release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh release view cv > /dev/null 2>&1 || gh release create cv --title "CV (latest)" --latest=false \
                    --notes "Rendered from the CV page on every push to main. Stable links: https://nexlein.vercel.app/cv.pdf (EN) and https://nexlein.vercel.app/fr/cv.pdf (FR)."
                  gh release upload cv cv-pdf/*.pdf --clobber
