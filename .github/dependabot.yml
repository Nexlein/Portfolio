version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore(deps)
      groups:
          npm-minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directories: ['/', '/.github/actions/*']
      target-branch: dev
      schedule:
          interval: weekly
          day: monday
      commit-message:
          prefix: ci(deps)
      groups:
          actions:
              patterns: ['*']
