name: Set up
description: Node from mise.toml, same as local, and the dependencies

runs:
    using: composite
    steps:
        - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
          with:
              install_args: node # the rest of mise.toml is for local hooks

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.npm
              key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

        - run: npm ci
          shell: bash
