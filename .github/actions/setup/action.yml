name: Set up
description: Node from mise.toml, same as local, and the dependencies

runs:
    using: composite
    steps:
        - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
          with:
              install_args: node # the rest of mise.toml is for local hooks

        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.npm
              key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

        - run: npm ci
          shell: bash
