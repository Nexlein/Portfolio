<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexlein — AI & Software Developer</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <meta name="description" content="Portfolio of Nielsen Combe-Bracciale (Nexlein) — Epitech student and AI systems developer building real-time simulations, decision engines, and C++ architectures.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ─── Top Navigation ───────────────────────────── -->
  <header class="topnav" id="topnav">
    <div class="topnav-inner">
      <a href="index.html#home" class="topnav-brand" aria-label="Back to top">
        <img class="brand-icon" src="/favicon.jpg" alt="Nexlein Logo" style="border-radius: 8px;" />
        <span class="brand-name">Nexlein</span>
      </a>

      <nav class="topnav-links" aria-label="Main navigation">
        <a href="index.html#home"     class="nav-link" data-section="home">Home</a>
        <a href="index.html#parcours" class="nav-link" data-section="parcours">Journey</a>
        <a href="index.html#projects" class="nav-link" data-section="projects">Projects</a>
        <a href="#"    class="nav-link active" data-section="ailab">AI Lab</a>
      </nav>
    </div>
  </header>

  <main>

    <!-- ─── AI Lab ─────────────────────────────────────── -->
    <section id="ailab" class="section section-ailab">
      <div class="section-eyebrow">Interactive · Browser-Native · No Backend</div>
      <h2 class="section-title">AI Lab</h2>
      <p class="section-sub">Five AI decision systems running live in your browser. Select an engine below, adjust the parameters, and observe the algorithm in real time.</p>

      <!-- Pills rendered from src/data/simulations.ts at boot time -->
      <div class="sim-pills" id="sim-pills" role="tablist" aria-label="Select AI simulation"></div>

      <!-- Sim views injected from src/data/simulations.ts at boot time -->
      <div id="sim-panel"></div>
    </section>

  </main>

  <script type="module" src="src/main.ts"></script>

  <!-- ─── Project Detail Modal ──────────────────────── -->
  <dialog id="project-modal" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" aria-label="Close project">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <div class="modal-inner">
      <!-- Left: media -->
      <div class="modal-media" id="modal-media"></div>

      <!-- Right: info -->
      <div class="modal-info">
        <div class="modal-tags" id="modal-tags"></div>
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-desc" id="modal-desc"></p>
        <a class="modal-github" id="modal-github" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
          View on GitHub
        </a>
      </div>
    </div>
  </dialog>
</body>

</html>
