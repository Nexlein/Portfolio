<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nexlein — Availability</title>
        <meta
            name="description"
            content="Nielsen Combe-Bracciale's availability: Epitech Tek3 full-time internship and freelance missions in AI integration and backend development."
        />
        <link rel="canonical" href="https://nexlein.vercel.app/availability.html" />

        <!-- Social previews (Open Graph / X) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Nexlein" />
        <meta property="og:title" content="Nexlein — Availability" />
        <meta
            property="og:description"
            content="Nielsen Combe-Bracciale's availability: Epitech Tek3 full-time internship and freelance missions in AI integration and backend development."
        />
        <meta property="og:url" content="https://nexlein.vercel.app/availability.html" />
        <meta property="og:image" content="https://nexlein.vercel.app/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Nielsen Combe-Bracciale, AI and software developer portfolio" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="stylesheet" href="/src/styles/global.css" />
        <link rel="stylesheet" href="/src/pages/availability/availability.css" />
        <link rel="stylesheet" href="/src/components/Navbar/Navbar.css" />
    </head>
    <body>
        <div id="nav-sentinel"></div>
        <main>
            <section id="availability" class="section section-home avail-page">
                <div class="home-ambient" aria-hidden="true">
                    <div class="ambient-orb orb-1"></div>
                    <div class="ambient-orb orb-2"></div>
                </div>

                <div class="home-content avail-container">
                    <div class="home-eyebrow">
                        <span class="mono-tag available" data-i18n="availability.tag">Available Now</span>
                    </div>

                    <h1 class="hero-name text-hero" data-i18n="availability.title">What I'm Looking For</h1>

                    <p class="hero-bio avail-bio" data-i18n="availability.bio">
                        I am an Epitech Tek3 student actively seeking professional opportunities to apply my skills in
                        AI, backend architecture, and high-performance software development.
                    </p>

                    <div class="avail-cards" data-render="offers"></div>

                    <!-- ─── Contact / Footer ──────────────────────────── -->
                    <footer id="contact" class="site-footer">
                        <div class="footer-inner">
                            <h2 class="footer-title" data-i18n="availability.footer">Interested? Let's connect.</h2>
                            <div class="footer-actions">
                                <a href="mailto:nielsen.combe-bracciale@epitech.eu" class="btn-hero-primary footer-btn">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        class="footer-btn-icon"
                                    >
                                        <path
                                            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                                        ></path>
                                        <polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                    <span data-i18n="availability.footerBtnEmail">Email Me</span>
                                </a>
                                <a
                                    href="https://www.linkedin.com/in/nielsen-combebracciale/"
                                    target="_blank"
                                    rel="noopener"
                                    class="btn-hero-ghost footer-btn"
                                >
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        class="footer-btn-icon"
                                    >
                                        <path
                                            d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                                        ></path>
                                        <rect x="2" y="9" width="4" height="12"></rect>
                                        <circle cx="4" cy="4" r="2"></circle>
                                    </svg>
                                    <span data-i18n="availability.footerBtnLinkedin">LinkedIn</span>
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            </section>
        </main>
        <script type="module" src="/src/pages/availability/availability.ts"></script>
    </body>
</html>
