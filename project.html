<!doctype html>
<!--
    Template for /projects/<id>.html (and /fr/projects/<id>.html).
    Never served as-is: vite-plugins/project-pages.ts fills it once per project and language at build time.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project — Nexlein</title>
        <meta name="description" content="" />
        <link rel="canonical" href="https://nexlein.vercel.app/" />

        <!-- Social previews (Open Graph / X) -->
        <meta property="og:type" content="article" />
        <meta property="og:site_name" content="Nexlein" />
        <meta property="og:title" content="" />
        <meta property="og:description" content="" />
        <meta property="og:url" content="" />
        <meta property="og:image" content="" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="stylesheet" href="/src/styles/base.css" />
        <link rel="stylesheet" href="/src/components/Nav/Nav.css" />
        <link rel="stylesheet" href="/src/components/Footer/Footer.css" />
        <link rel="stylesheet" href="/src/pages/project/project.css" />
    </head>
    <body>
        <div data-render="nav"></div>

        <main id="main">
            <article class="project wrap">
                <a id="project-back" class="project-back" href="/#work">
                    <span aria-hidden="true">‹</span> <span data-i18n="projectPage.back">All projects</span>
                </a>

                <header class="project-head reveal">
                    <p id="project-eyebrow" class="eyebrow"></p>
                    <h1 id="project-title" class="project-title"></h1>
                    <p id="project-desc" class="project-desc"></p>
                    <a id="project-github" class="btn press" href="/">
                        <span data-i18n="projectPage.code">View the code</span> <span aria-hidden="true">›</span>
                    </a>
                </header>

                <div id="project-media" class="project-media surface reveal"></div>

                <dl id="project-specs" class="specs reveal"></dl>
                <dl id="project-story" class="story reveal"></dl>
            </article>

            <!-- Connected projects: the map's nearest neighbours (src/components/NeuralMap/graph.ts) -->
            <section class="section related" aria-labelledby="related-title">
                <div class="section-head reveal">
                    <h2 class="headline small" id="related-title">
                        <span class="line"><span data-i18n="projectPage.related1">Connected projects.</span></span>
                        <span class="line"
                            ><span class="recede" data-i18n="projectPage.related2"
                                >Where the skills lead next.</span
                            ></span
                        >
                    </h2>
                </div>
                <div id="project-related" class="related-grid wrap"></div>
            </section>
        </main>

        <div data-render="footer"></div>

        <script type="module" src="/src/pages/project/project.ts"></script>
    </body>
</html>
