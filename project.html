<!doctype html>
<!--
    Template for /projects/<id>.html (and /fr/projects/<id>.html).
    Never served as-is: vite-plugins/project-pages.ts fills it once per project and language at build time.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project — Nexlein</title>
        <meta name="description" content="" />
        <link rel="canonical" href="https://nexlein.vercel.app/" />

        <!-- Social previews (Open Graph / X) -->
        <meta property="og:type" content="article" />
        <meta property="og:site_name" content="Nexlein" />
        <meta property="og:title" content="" />
        <meta property="og:description" content="" />
        <meta property="og:url" content="" />
        <meta property="og:image" content="" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="stylesheet" href="/src/styles/global.css" />
        <link rel="stylesheet" href="/src/components/Navbar/Navbar.css" />
        <link rel="stylesheet" href="/src/components/ProjectModal/ProjectModal.css" />
        <link rel="stylesheet" href="/src/pages/project/project.css" />
    </head>
    <body>
        <div id="nav-sentinel"></div>
        <main>
            <article id="project" class="section project-page">
                <a id="project-back" class="project-back" href="/#projects">
                    <span aria-hidden="true">←</span>
                    <span data-i18n="projectPage.back">All projects</span>
                </a>

                <header class="project-header">
                    <span id="project-eyebrow" class="mono-tag"></span>
                    <h1 id="project-title" class="project-title"></h1>
                    <div id="project-tags" class="modal-tags"></div>
                </header>

                <div class="project-body">
                    <div id="project-media" class="modal-media project-media-frame"></div>

                    <div class="project-info-col">
                        <p id="project-desc" class="project-desc"></p>
                        <a id="project-github" class="modal-github" target="_blank" rel="noopener">
                            <span data-i18n="modal.github">View on GitHub</span>
                        </a>
                    </div>
                </div>
            </article>
        </main>

        <script type="module" src="/src/pages/project/project.ts"></script>
    </body>
</html>
